<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Diploma">
  <g transform="rotate(-20 50 50)">
    <!-- paper body -->
    <rect x="14" y="36" width="72" height="28" fill="#f7f0e1" stroke="#8a7658" stroke-width="2"/>
    <line x1="22" y1="44" x2="40" y2="44" stroke="#c9b894" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="50" x2="40" y2="50" stroke="#c9b894" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="44" x2="78" y2="44" stroke="#c9b894" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="50" x2="78" y2="50" stroke="#c9b894" stroke-width="2" stroke-linecap="round"/>
    <!-- rolled ends -->
    <ellipse cx="14" cy="50" rx="6" ry="14" fill="#ece0c6" stroke="#8a7658" stroke-width="2"/>
    <ellipse cx="14" cy="50" rx="2.5" ry="6" fill="none" stroke="#8a7658" stroke-width="1.5"/>
    <ellipse cx="86" cy="50" rx="6" ry="14" fill="#ece0c6" stroke="#8a7658" stroke-width="2"/>
    <ellipse cx="86" cy="50" rx="2.5" ry="6" fill="none" stroke="#8a7658" stroke-width="1.5"/>
    <!-- ribbon band -->
    <rect x="45" y="35" width="8" height="30" fill="#bd5d38"/>
    <!-- ribbon tails -->
    <polygon points="47,64 40,86 44,83 46,88 51,66" fill="#9c4a2b"/>
    <polygon points="51,64 58,86 54,83 52,88 47,66" fill="#bd5d38"/>
    <!-- seal -->
    <circle cx="49" cy="64" r="7" fill="#bd5d38" stroke="#9c4a2b" stroke-width="2"/>
    <circle cx="49" cy="64" r="3" fill="none" stroke="#f7f0e1" stroke-width="1.2"/>
  </g>
</svg>
